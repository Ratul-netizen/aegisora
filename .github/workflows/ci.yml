name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # uops-store-pg's queries are checked against the schema at COMPILE time. Offline
  # mode uses the checked-in .sqlx/ metadata so that every job — and every clone —
  # builds without a database. The integration job turns this off and checks the
  # metadata against a real server.
  SQLX_OFFLINE: "true"

jobs:
  check:
    name: fmt · clippy · doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # --all-targets compiles every test as well, so a test that no longer builds
      # still fails here even though none of them run in this job.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The workspace test suite deliberately does NOT run here. Much of it needs
      # PostgreSQL and ClickHouse, and a job without them fails on the integration
      # targets rather than skipping them — this project does not keep tests that
      # quietly pass when the thing they test is absent. The suite runs once, in
      # `integration`, which has both engines.
      #
      # Doctests do run here: they include the `compile_fail` ones that enforce the
      # security invariants — Secret<T> is not Display/Serialize/Clone, TenantScope is
      # not Display/Default — and none of them touch a database.
      - name: Doctests
        run: cargo test --workspace --doc

      # Guards the bus conformance suite from going vacuous. It is the executable form
      # of the TelemetryBus contract, and the whole NATS migration rests on it still
      # meaning something a year from now. Removing backpressure — the behaviour
      # PLAN 0 change #4 chose deliberately — must fail it.
      - name: The bus conformance suite fails when backpressure is removed
        run: |
          F=crates/uops-bus/src/inprocess.rs
          cp "$F" "$RUNNER_TEMP/inprocess.bak"
          sed -i 's/if sender.send(delivery).await.is_err()/if sender.try_send(delivery).is_err()/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-bus --test conformance_inprocess > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/inprocess.bak" "$F"
            echo "::error::conformance passed with backpressure removed"
            exit 1
          fi
          cp "$RUNNER_TEMP/inprocess.bak" "$F"
          echo "ok: dropping instead of blocking fails the suite"

  secrets-hygiene:
    name: no credential material in logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SPEC M0.4: Secret<T> cannot be Display or Serialize, so the remaining way to
      # leak material is to call .expose() inside a formatting or logging macro. That
      # is a deliberate act and therefore greppable.
      #
      # Comment lines are dropped, for the same reason as the crypto guard below: prose
      # about the rule is not a violation of it, and a guard that also forbids writing
      # down the reasoning teaches people to delete the reasoning.
      #
      # `credential-print:` exempts one line. The first-run administrator password is
      # printed on a terminal on purpose — that is the whole design, see
      # uops-server/src/firstrun.rs — and there is no way to write it that a grep for
      # "secret reaching a macro" would not find. The exemption is a marker on the line
      # itself rather than in the comment above it, so it cannot be borrowed by the next
      # line down; and the count is asserted below, so adding a second one is a change
      # someone has to make deliberately and defend in review.
      - name: No .expose() inside logging or formatting macros
        run: |
          MACROS='(println!|eprintln!|format!|write!|writeln!|trace!|debug!|info!|warn!|error!|json!)[^;]*\.expose\(\)'
          code=$(grep -rnE "$MACROS" --include='*.rs' crates/ \
                 | grep -vE ':[0-9]+:[[:space:]]*//' || true)

          hits=$(printf '%s' "$code" | grep -v 'credential-print:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::credential material reachable from a logging or formatting macro"
            exit 1
          fi

          exempt=$(printf '%s' "$code" | grep -c 'credential-print:' || true)
          if [ "$exempt" -ne 1 ]; then
            printf '%s\n' "$code"
            echo "::error::expected exactly 1 credential-print exemption, found $exempt"
            exit 1
          fi
          echo "ok: 1 deliberate credential print, 0 accidental"

      # The AeadProvider trait is the only sanctioned path to crypto primitives.
      #
      # The second grep drops comment lines. Naming Argon2 in prose is how the login
      # handler explains why it verifies a decoy hash for a user that does not exist —
      # the guard is against *calling* the primitive, and a guard that also forbids
      # writing down the reasoning teaches people to delete the reasoning.
      - name: No direct AEAD or KDF use outside uops-secrets
        run: |
          hits=$(grep -rnE '\b(Aes256Gcm|ChaCha20Poly1305|Argon2|aws_lc_rs)\b' \
                   --include='*.rs' crates/ --exclude-dir=uops-secrets \
                 | grep -vE ':[0-9]+:[[:space:]]*//' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::crypto primitive used outside uops-secrets; go through AeadProvider"
            exit 1
          fi
          echo "ok"

  integration:
    name: schemas · repositories · api
    runs-on: ubuntu-latest

    # Both engines in one job, because the things under test span them: POST /query
    # resolves a selector against PostgreSQL and answers it from ClickHouse. Split
    # across two jobs, every test that crosses that seam has no home — which is the
    # mistake this file previously made.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uops
          POSTGRES_PASSWORD: uops
          POSTGRES_DB: uops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uops -d uops"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        # Pinned to the version W1 was measured on. The text index reached GA in 26.x
        # and its function names moved during the beta — see the searchAll() note in
        # uops-query's compile.rs.
        image: clickhouse/clickhouse-server:26.8-alpine
        env:
          CLICKHOUSE_DB: uops
          CLICKHOUSE_USER: uops
          CLICKHOUSE_PASSWORD: uops
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --user uops --password uops --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://uops:uops@localhost:5432/uops
      PGPASSWORD: uops
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_DB: uops
      CLICKHOUSE_USER: uops
      CLICKHOUSE_PASSWORD: uops
      # This job has servers, so queries are verified against them rather than against
      # the recorded metadata.
      SQLX_OFFLINE: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ---- PostgreSQL -------------------------------------------------------------

      # The same tool deployments use. Applying with psql would leave _sqlx_migrations
      # empty, so CI would not be exercising the real upgrade path.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls --locked

      - name: Apply PostgreSQL migrations
        run: sqlx migrate run

      # Re-running must apply nothing. If the migration state were not recorded, this
      # second run would fail on "type already exists" — and an on-premise customer
      # upgrading unattended would hit that instead of CI.
      - name: Re-running PostgreSQL migrations applies nothing
        run: sqlx migrate run

      - name: Schema invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/tests/invariants.sql

      # The recorded query metadata must match the queries in the tree, or an offline
      # build verifies something that is no longer there.
      - name: Query metadata is current
        run: |
          cargo sqlx prepare --workspace --check -- --all-targets || {
            echo "::error::.sqlx is stale — run: cargo sqlx prepare --workspace -- --all-targets"
            exit 1
          }

      # ---- ClickHouse -------------------------------------------------------------

      - name: Apply ClickHouse migrations
        run: bash scripts/ch.sh apply

      - name: Re-running ClickHouse migrations applies nothing
        run: |
          OUT="$(bash scripts/ch.sh apply)"
          echo "$OUT"
          echo "$OUT" | grep -q "schema is up to date" || {
            echo "::error::the runner did not recognise an up-to-date schema"
            exit 1
          }

      # The check nothing else performs: uops-query's golden SQL against the schema
      # ch-migrations actually creates. Unit tests on both sides pass while they drift,
      # which is how searchAll() — a function that does not exist — survived for weeks.
      - name: Query codegen matches the schema
        run: bash scripts/ch.sh verify

      # Materialised views, materialised columns and the text index, asserted on real
      # rows rather than on the DDL text.
      - name: Schema behaviour
        run: bash scripts/ch.sh smoke

      # ---- Everything -------------------------------------------------------------

      # The whole suite, in the one job that has what it needs. Unit and integration
      # together: which is which is not a distinction worth maintaining in a list
      # somebody has to remember to update.
      - name: Workspace tests
        run: cargo test --workspace --all-targets

      # ---- Guards on the tests themselves -----------------------------------------
      #
      # Each of these breaks something on purpose and requires the suite to FAIL. A
      # test that passes whether or not the property holds is worse than no test,
      # because it reads as covered — and this repository has been caught by that
      # twice: the compile_fail doctests in uops-core, and a login-timing assertion
      # that measured everything except the thing it was protecting.

      - name: The schema invariants fail when an invariant is removed
        run: |
          DROP="ALTER TABLE resource DROP CONSTRAINT resource_parent_id_tenant_id_fkey;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "$DROP"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/tests/invariants.sql > /dev/null 2>&1; then
            echo "::error::the schema invariant suite passed with tenant isolation removed"
            exit 1
          fi
          echo "ok: removing the constraint fails the suite"

      # Two replicas of the server starting in the same second both see an empty
      # app_user. Without the advisory lock both bootstrap, and the operator is shown
      # two passwords, one of which belongs to an account they will never find again.
      # Nothing about the code looks wrong when this breaks: a shared lock is still a
      # lock, and still spelled like one.
      - name: The bootstrap tests fail when the advisory lock stops excluding
        run: |
          F=crates/uops-store-pg/src/bootstrap.rs
          cp "$F" "$RUNNER_TEMP/bootstrap.bak"
          sed -i 's/pg_advisory_xact_lock(/pg_advisory_xact_lock_shared(/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-store-pg --test bootstrap > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/bootstrap.bak" "$F"
            echo "::error::the bootstrap tests passed with a lock that excludes nobody"
            exit 1
          fi
          cp "$RUNNER_TEMP/bootstrap.bak" "$F"
          echo "ok: a shared bootstrap lock fails the suite"

      # The single most user-visible way this product can fail on day one: the password
      # on the terminal is not the password in the database. Nothing crashes, nothing
      # logs, and the installation simply cannot be entered. The mutation stores a hash
      # of a second generated password — still a real Argon2 hash of a real password,
      # so nothing downstream looks wrong.
      - name: The boot test fails when the announced password is not the stored one
        run: |
          F=crates/uops-server/src/firstrun.rs
          cp "$F" "$RUNNER_TEMP/firstrun.bak"
          sed -i 's/^    let hash = password::hash(&plaintext)?;$/    let hash = password::hash(\&generate::password()?)?;/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-server --test boot > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/firstrun.bak" "$F"
            echo "::error::the boot tests passed with a password nobody could log in with"
            exit 1
          fi
          cp "$RUNNER_TEMP/firstrun.bak" "$F"
          echo "ok: announcing the wrong password fails the suite"

      # SPEC §M1's headline acceptance criterion, guarded.
      #
      # The mutation leaves `tenant_id = $2` in the SQL and makes it always true. That
      # matters: the source scanner in uops-store-pg::enforced greps for a tenant
      # predicate and still finds one, and the schema invariants still pass, because
      # neither of them executes anything. Verified — both are green under this
      # mutation. The isolation test is the only thing in the repository that catches
      # it, which is the argument for the test existing.
      - name: The isolation tests fail when a tenant predicate stops filtering
        run: |
          F=crates/uops-store-pg/src/resource.rs
          cp "$F" "$RUNNER_TEMP/resource.bak"
          sed -i 's/WHERE id = \$1 AND tenant_id = \$2/WHERE id = $1 AND (tenant_id = $2 OR TRUE)/g' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-api --test isolation > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/resource.bak" "$F"
            echo "::error::the isolation tests passed with a tenant predicate that matches every row"
            exit 1
          fi
          cp "$RUNNER_TEMP/resource.bak" "$F"
          echo "ok: a tenant predicate that filters nothing fails the suite"

      # And the coverage half of it: a route added without an isolation case must fail
      # before any request is sent. Without this, "every endpoint" decays to "every
      # endpoint that existed when someone last thought about it".
      - name: The isolation tests fail when a route has no case
        run: |
          F=crates/uops-api/src/routes/mod.rs
          cp "$F" "$RUNNER_TEMP/routes.bak"
          sed -i 's|\.route("/api/v1/query", post(query::run))|.route("/api/v1/query", post(query::run))\n        .route("/api/v1/mutation-guard", get(auth::me))|' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-api --test isolation > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/routes.bak" "$F"
            echo "::error::the isolation tests passed with an uncovered route"
            exit 1
          fi
          cp "$RUNNER_TEMP/routes.bak" "$F"
          echo "ok: an uncovered route fails the suite"

      - name: The API isolation tests fail when the role check is removed
        run: |
          F=crates/uops-api/src/extract.rs
          cp "$F" "$RUNNER_TEMP/extract.bak"
          sed -i 's/\.ok_or(ApiError::NotFound)?;/.unwrap_or(Role::Viewer);/' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-api --test extractor > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/extract.bak" "$F"
            echo "::error::isolation tests passed with the role check removed"
            exit 1
          fi
          cp "$RUNNER_TEMP/extract.bak" "$F"
          echo "ok: defaulting an absent role fails the suite"

      - name: The audit tests fail when the scope stops registering
        run: |
          F=crates/uops-api/src/extract.rs
          cp "$F" "$RUNNER_TEMP/extract-audit.bak"
          sed -i 's/^        recorder.set_context(tenant, scope.actor().as_audit_str());$//' "$F"
          if git diff --quiet -- "$F"; then
            echo "::error::the mutation did not apply; this guard is no longer guarding anything"
            exit 1
          fi
          if cargo test -p uops-api --test resources > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/extract-audit.bak" "$F"
            echo "::error::the audit tests passed with the registration removed"
            exit 1
          fi
          cp "$RUNNER_TEMP/extract-audit.bak" "$F"
          echo "ok: an unregistered scope fails the audit suite"

      # Login must cost the same whether or not the address exists. Short-circuiting
      # the absent-user path skips Argon2 and turns the response time into an
      # account-enumeration oracle.
      - name: The login timing test fails when the absent-user path short-circuits
        run: |
          F=crates/uops-api/src/routes/auth.rs
          cp "$F" "$RUNNER_TEMP/auth.bak"
          python3 - "$F" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path, encoding="utf-8").read()
          marker = "    let found = state.store.user_credentials_by_email(email).await?;"
          assert marker in src, "the mutation target moved"
          src = src.replace(
              marker,
              marker + "\n    if found.is_none() {\n        return Err(ApiError::Unauthenticated);\n    }",
              1,
          )
          open(path, "w", encoding="utf-8").write(src)
          PY
          if cargo test -p uops-api --test auth_routes > /dev/null 2>&1; then
            cp "$RUNNER_TEMP/auth.bak" "$F"
            echo "::error::the login timing test passed with the absent-user path short-circuited"
            exit 1
          fi
          cp "$RUNNER_TEMP/auth.bak" "$F"
          echo "ok: short-circuiting the absent-user path fails the suite"

      # Left last: it edits a migration file, and the runner must refuse to continue
      # afterwards, so nothing else in this job can run behind it.
      - name: An edited applied migration is refused
        run: |
          echo "-- appended by CI to simulate an edit" >> ch-migrations/0003_logs_counts_5m.sql
          if bash scripts/ch.sh apply; then
            echo "::error::the runner accepted an edited migration that was already applied"
            exit 1
          fi
          echo "ok: editing an applied migration stops the run"

  supply-chain:
    name: advisories · licenses · SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # PLAN 0b: supply-chain review is standard in government and enterprise
      # procurement. Producing this from the first release is cheap; retrofitting it
      # to a mature dependency tree is archaeology.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: cargo cyclonedx --all --format json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"

  crypto-builds:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard (RustCrypto)
            features: ""
          # NOTE: the FIPS artifact is NOT built here yet.
          #
          # SPEC §M0.4 requires the crypto backend to be a build-time choice, because
          # validation attaches to a binary rather than to a code path. The seam for
          # that exists — `AeadProvider`, the `crypto-awslc` feature, and a CI grep
          # that keeps primitives out of every other crate — but aws-lc-rs is not
          # wired behind it, and the feature currently raises a `compile_error!`
          # saying so.
          #
          # Adding a job here that builds a known-failing target would be theatre.
          # PLAN §0b is explicit: build the seams, pursue no certification until a
          # buyer funds it. Restore this matrix entry in the same commit that
          # implements `AwsLcAead`:
          #
          #   - name: FIPS (aws-lc-rs)
          #     features: "--no-default-features --features crypto-awslc"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace ${{ matrix.features }}

      # Guards the seam itself: the feature must keep failing loudly and for the
      # documented reason, rather than silently falling back to a non-validated
      # backend while a deployment believes it is running FIPS crypto.
      - name: FIPS feature fails closed until implemented
        if: matrix.features == ''
        run: |
          if cargo check -p uops-secrets --no-default-features --features crypto-awslc 2>/dev/null; then
            echo "::error::crypto-awslc compiled without an implementation — it must fail closed"
            exit 1
          fi
          echo "ok: crypto-awslc refuses to build until AwsLcAead exists"

  web:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ci, not install: it installs exactly the lockfile and fails if package.json and
      # the lockfile disagree, which is the whole reason the lockfile is committed.
      - run: npm ci

      - name: typecheck
        run: npx tsc -b --noEmit

      - name: lint
        run: npx eslint src

      - name: test
        run: npx vitest run

      - name: build
        run: npm run build

      # The session cookie is HttpOnly and cannot be read by script; the CSRF cookie is
      # read by src/api.ts and nothing else. Neither belongs in storage, where it would
      # outlive the session and be readable by anything running on the origin.
      #
      # Comment lines are dropped, as in the Rust hygiene guards: src/api.ts explains at
      # the top why there is no token in localStorage, and a guard that forbids saying so
      # gets the explanation deleted instead of the rule followed.
      - name: No credential or tenant state in browser storage
        run: |
          hits=$(grep -rnE '\b(localStorage|sessionStorage|indexedDB)\b' src/ \
                 | grep -vE ':[0-9]+:[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::browser storage in the web app; the session is a cookie the server sets"
            exit 1
          fi
          echo "ok"

  # SPEC §M1 acceptance: "docker compose up gives a working stack from a clean checkout
  # on a clean machine". A CI runner is literally that, every time, which makes this the
  # only place the claim can be tested rather than asserted.
  #
  # The slowest job here by a wide margin — it is a release build of the workspace plus
  # a production web build. It earns it: everything else in this file tests the code,
  # and this tests whether a person who has just cloned the repository can run it.
  stack:
    name: docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # BuildKit's cache is what makes a rebuild seconds rather than minutes. Scoped to
      # this job so it cannot be poisoned by another, and capped by GitHub's own cache
      # eviction rather than growing forever.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: uops:dev
          load: true
          cache-from: type=gha,scope=stack
          cache-to: type=gha,scope=stack,mode=max

      - name: Bring the stack up
        run: docker compose -f deploy/docker-compose.yml up -d

      - name: Wait for the server to report healthy
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' uops-server 2>/dev/null || echo starting)
            if [ "$state" = "healthy" ]; then
              echo "healthy after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the server never became healthy"
          docker compose -f deploy/docker-compose.yml logs
          exit 1

      # Migrations are a separate service that must run to completion. If it did not,
      # `server` would not have started at all — but a green `up` with a silently
      # skipped migration is exactly the failure this criterion is about.
      - name: Migrations ran, and ran to completion
        run: |
          docker compose -f deploy/docker-compose.yml logs migrate
          docker compose -f deploy/docker-compose.yml logs migrate | grep -q "schema is up to date"
          docker compose -f deploy/docker-compose.yml logs migrate | grep -qE "applied [0-9]+ migration"

      - name: The stack answers, and answers as itself
        run: |
          set -e

          # The API, unauthenticated, reporting both stores reachable.
          health=$(curl -fsS http://localhost:8080/api/v1/health)
          echo "$health"
          echo "$health" | grep -q '"ok":true'

          # The web app, from the same origin as the API. That is the property the
          # session cookie depends on, and here it is structural rather than configured.
          curl -fsS http://localhost:8080/ | grep -qi "<title>"

          # A client-side route on a hard reload must reach the app, not a 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/resources/whatever)" = 200

          # And a mistyped API path must not fall through to it. 200 and a page of HTML
          # is a client parsing failure reported as something other than "no such route".
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/no-such-endpoint)
          test "$code" = 404

      - name: The first-run credential is printed, once, and it works
        run: |
          set -e
          password=$(docker compose -f deploy/docker-compose.yml logs server \
                     | grep -E '^\S+\s+\|\s+password\s+' | awk '{print $NF}')
          test -n "$password"

          # The whole point of the first-run design: the credential on the terminal is
          # one the login handler accepts. A bootstrap that made an account nobody can
          # authenticate as passes every other check in this job.
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/jar \
                 -H 'Content-Type: application/json' \
                 -d "{\"email\":\"admin@example.invalid\",\"password\":\"$password\"}" \
                 http://localhost:8080/api/v1/auth/login)
          test "$code" = 204

          curl -fsS -b /tmp/jar http://localhost:8080/api/v1/me | grep -q 'admin@example.invalid'

      - name: A restart re-migrates nothing and prints no second password
        run: |
          set -e
          docker compose -f deploy/docker-compose.yml restart server migrate
          sleep 20
          # Exactly one banner across both boots. A second would mean a second admin,
          # and the operator has no way to tell which password belongs to which account.
          banners=$(docker compose -f deploy/docker-compose.yml logs server | grep -c 'First run' || true)
          test "$banners" = "1"

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
