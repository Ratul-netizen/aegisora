# A test agent. Everything here is deliberately public — see the Dockerfile.

agentAddress udp:0.0.0.0:161

# v2c, for the community-string path.
rocommunity uops-test default

# v3: the user is created by the entrypoint, which knows which algorithms this build of
# net-snmp actually supports. Read-only, whole tree.
rouser uops-v3 authPriv

# Enough of a system group to be recognisable in a test.
sysLocation  a test container
sysContact   nobody@example.invalid
sysName      uops-test-agent

# An ifTable exists because the container has interfaces; nothing extra is needed to
# make interface discovery testable.

# Bound explicitly to every interface. `udp:161` means the same thing, and saying it
# this way makes "is it listening where the port mapping expects" answerable by reading
# the file rather than by running netstat inside the container.
