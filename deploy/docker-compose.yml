# The whole stack, from a clean checkout.
#
#     docker compose -f deploy/docker-compose.yml up --build
#     open http://localhost:8080          # the password is in the `server` logs, once
#
# SPEC §M1 acceptance: "docker compose up gives a working stack from a clean checkout on
# a clean machine". Four services and one image: the two storage engines, a migration
# step that runs to completion, and the server.
#
# Developing against it instead of in it:
#
#     docker compose -f deploy/docker-compose.yml up -d postgres clickhouse
#     bash scripts/db.sh migrate && bash scripts/ch.sh apply
#     bash scripts/serve.sh                     # cargo run, on :8080
#     cd web && npm run dev                     # vite, on :5173, proxying to :8080
#
# Credentials here are development defaults and are meant to be obvious. A deployment
# that reaches production with them is a deployment that never read this file.
#
# Disk
# ----
# The shipped image is around 30 MB — a multi-stage build, so the Rust and Node
# toolchains do not travel with it. What is large is BuildKit's cache, which holds the
# cargo registry and the release target directory and reaches roughly 4.5 GB. It is
# what makes a rebuild take seconds instead of ten minutes, and it is pure cache:
#
#     docker builder prune -f       # reclaims all of it, costs a full rebuild next time
#     docker compose down -v        # also drops the database volumes
#
# Worth knowing on Docker Desktop: reclaiming space inside the VM does not shrink the
# VM's disk image on the host. That needs Settings → Resources → Disk image size, or
# `wsl --manage docker-desktop-data --set-sparse true`.

services:
  postgres:
    image: postgres:17-alpine
    container_name: uops-dev-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: uops
      POSTGRES_PASSWORD: uops
      POSTGRES_DB: uops
      # C collation with UTF-8 encoding: deterministic sort order that does not change
      # under the operator's ICU version. On-premise customers run whatever base image
      # their platform team standardised on, and a locale-dependent index is a
      # corruption waiting for an upgrade.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uops -d uops"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    # Pinned to the version W1 was measured on. The text index reached GA in 26.x and
    # its syntax moved during the beta, so "whatever is latest" is not a safe default
    # for a schema that depends on it.
    image: clickhouse/clickhouse-server:26.8-alpine
    container_name: uops-dev-ch
    ports:
      - "8123:8123"   # HTTP — what the migration runner speaks
      - "9000:9000"   # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_DB: uops
      CLICKHOUSE_USER: uops
      CLICKHOUSE_PASSWORD: uops
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "uops", "--password", "uops",
             "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A real SNMP agent, for the half of SPEC §M2's acceptance criterion a simulator
  # cannot satisfy: "SNMPv3 authPriv (SHA-256 / AES-256) against a real device".
  #
  # Behind a profile, so `docker compose up` does not start it. It is a test fixture,
  # not part of the product:
  #
  #     docker compose -f deploy/docker-compose.yml --profile test up -d snmp-agent
  #     UOPS_SNMP_AGENT=127.0.0.1:16100 cargo test -p uops-snmp -- --ignored
  #
  # Every credential here is written down in this repository on purpose.
  snmp-agent:
    profiles: ["test"]
    build:
      context: snmp-agent
    image: uops-snmp-agent:test
    container_name: uops-snmp-agent
    ports:
      # Not 161: the host may already have an agent, and a test fixture should not
      # need root to bind.
      - "16100:161/udp"
    healthcheck:
      # v2c rather than v3, because this only has to prove the agent is answering —
      # whether v3 authPriv works is what the test suite is for, and a healthcheck that
      # duplicates the assertion hides which one failed.
      test: ["CMD", "snmpget", "-v2c", "-c", "uops-test", "-t", "2", "-r", "1",
             "127.0.0.1", "1.3.6.1.2.1.1.5.0"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrations are their own step, not something the server does on boot. A server that
  # applies its own DDL is N replicas racing on a rolling deploy and a rollback that has
  # quietly become a data migration. This runs to completion and exits; the server waits
  # for that exit to be a success.
  #
  # Both runners are idempotent, so restarting the stack re-runs this and it does
  # nothing — which is the property that makes `up` safe to type twice.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: uops:dev
    container_name: uops-migrate
    # Root, only here, only to create the key file and hand it to the uops user. Every
    # long-running service below runs as uops.
    user: root
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://uops:uops@postgres:5432/uops
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: uops
      CLICKHOUSE_USER: uops
      CLICKHOUSE_PASSWORD: uops
    volumes:
      - kek:/srv/kek
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        uops-pg-migrate
        uops-ch-migrate apply --dir /srv/ch-migrations
        # The key-encryption key, generated once and kept in a volume.
        #
        # Not a literal in this file: a key committed to a repository is a key in every
        # clone, every fork and every CI log, and the one thing certain about a
        # convenient development default is that somebody will ship it. Generated here
        # because this service already runs once, before anything else, and is the only
        # place a first-boot step belongs.
        #
        # 0600 and owned by the uops user, because KekRing::from_file refuses a
        # group-readable key -- rightly: a KEK other local accounts can read is not a
        # root of trust.
        if [ ! -f /srv/kek/kek.hex ]; then
          od -An -tx1 -N32 /dev/urandom | tr -dc '0-9a-f' > /srv/kek/kek.hex
          chmod 600 /srv/kek/kek.hex
          echo "generated a key-encryption key in the kek volume"
        fi
        chown uops:uops /srv/kek/kek.hex
    restart: "no"

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: uops:dev
    container_name: uops-server
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://uops:uops@postgres:5432/uops
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: uops
      CLICKHOUSE_USER: uops
      CLICKHOUSE_PASSWORD: uops
      # Bound to every interface *inside the container*; what is reachable from outside
      # is the port mapping above. The binary's own default is loopback, which in a
      # container would be reachable by nothing at all.
      UOPS_BIND: 0.0.0.0:8080
      # Plain HTTP on localhost. A browser silently discards a Secure cookie over http,
      # so without this the app would appear to accept a password and then fail to stay
      # signed in, for a reason nothing logs. Anything serving this over a network puts
      # TLS in front and removes this line.
      UOPS_INSECURE_COOKIES: "1"
      UOPS_ORG_NAME: "Example organization"
      UOPS_TENANT_NAME: "Example tenant"
      UOPS_ADMIN_EMAIL: admin@example.invalid
      # The same file the poller reads. A credential the API sealed that the poller
      # cannot open is a device that silently never gets polled, which is the worst way
      # for this to be misconfigured -- so there is one file and both mount it.
      UOPS_KEK_FILE: /srv/kek/kek.hex
    volumes:
      - kek:/srv/kek:ro
    healthcheck:
      # The route is unauthenticated precisely so this can read it. `ok` is false when a
      # store is unreachable, and that is still a 200 — a restart does not fix somebody
      # else's database, so this checks that the server is answering, not that its
      # dependencies are well.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    # The first boot prints an administrator password exactly once, to stdout. It is not
    # stored anywhere and cannot be asked for again: `docker compose logs server`.
    restart: unless-stopped

  poller:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: uops:dev
    container_name: uops-poller
    depends_on:
      # Not on the server: they share a database and neither calls the other. Waiting
      # would only mean the poller could not start while the API was restarting.
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://uops:uops@postgres:5432/uops
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: uops
      CLICKHOUSE_USER: uops
      CLICKHOUSE_PASSWORD: uops
      UOPS_KEK_FILE: /srv/kek/kek.hex
    volumes:
      - kek:/srv/kek:ro
    # The availability check uses an unprivileged ICMP datagram socket rather than a raw
    # one, so it needs no CAP_NET_RAW. Docker sets this sysctl to `0 2147483647` on its
    # default bridge already; naming it here is what keeps it true on a host whose
    # daemon has been configured otherwise, and is where the requirement is written down.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    # No ports. Nothing connects *to* a poller.
    #
    # It polls nothing until a device exists with a `mgmt_ip` identifier and a credential
    # assigned to it -- see the README. An empty inventory is not an error and the poller
    # says so once a minute rather than failing.
    entrypoint: ["/usr/local/bin/uops-poller"]
    restart: unless-stopped

  syslog:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: uops:dev
    container_name: uops-syslog
    depends_on:
      # Not on the server, for the same reason as the poller: they share a database and
      # neither calls the other.
      migrate: { condition: service_completed_successfully }
    ports:
      # The well-known ports on the outside, high ports on the inside. Binding below 1024
      # needs CAP_NET_BIND_SERVICE, which is one more thing to get right on every host --
      # and a published port is a mapping Docker already does. Senders still use 514.
      - "514:1514/udp"
      - "601:1601"
    environment:
      DATABASE_URL: postgres://uops:uops@postgres:5432/uops
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: uops
      CLICKHOUSE_USER: uops
      CLICKHOUSE_PASSWORD: uops
      UOPS_SYSLOG_CONFIG: /srv/syslog/listeners.yaml
      # No UOPS_KEK_FILE. A syslog collector opens no credentials -- it reads a socket
      # and writes rows -- so it is not given the key that decrypts every credential in
      # the installation. The poller needs it; this does not; so it does not get it.
    volumes:
      # Read-only, and a bind mount rather than a named volume: this is configuration a
      # human edits and puts in a change ticket, not state the container owns.
      - ./syslog:/srv/syslog:ro
    # No TLS. SPEC asks for syslog over TLS and the answer is a proxy in front of the TCP
    # port -- rustls' two production crypto providers both carry OpenSSL-licensed code
    # and neither is on deny.toml's allow-list, which is already why the ClickHouse and
    # PostgreSQL clients were built without it. stunnel or rsyslog terminates and forwards
    # plaintext over the loopback. See STATUS.
    entrypoint: ["/usr/local/bin/uops-collector-syslog"]
    restart: unless-stopped

volumes:
  pg-data:
  ch-data:
  # The key-encryption key. A named volume rather than a bind mount so that `docker
  # compose down` keeps it: losing it means every stored credential becomes
  # undecryptable, and `down -v` is the only way to say that on purpose.
  kek:
