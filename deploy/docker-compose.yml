
# Development stack: the two storage engines. The server itself joins once there is a
# binary to run.
#
#     docker compose -f deploy/docker-compose.yml up -d
#     bash scripts/db.sh migrate && bash scripts/db.sh test
#     cargo run -p uops-ch-migrate -- apply
#
# Credentials here are development defaults and are meant to be obvious. A deployment
# that reaches production with these is a deployment that never read this file.

services:
  postgres:
    image: postgres:17-alpine
    container_name: uops-dev-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: uops
      POSTGRES_PASSWORD: uops
      POSTGRES_DB: uops
      # C collation with UTF-8 encoding: deterministic sort order that does not change
      # under the operator's ICU version. On-premise customers run whatever base image
      # their platform team standardised on, and a locale-dependent index is a
      # corruption waiting for an upgrade.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uops -d uops"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    # Pinned to the version W1 was measured on. The text index reached GA in 26.x and
    # its syntax moved during the beta, so "whatever is latest" is not a safe default
    # for a schema that depends on it.
    image: clickhouse/clickhouse-server:26.8-alpine
    container_name: uops-dev-ch
    ports:
      - "8123:8123"   # HTTP — what the migration runner speaks
      - "9000:9000"   # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_DB: uops
      CLICKHOUSE_USER: uops
      CLICKHOUSE_PASSWORD: uops
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "uops", "--password", "uops",
             "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg-data:
  ch-data:
