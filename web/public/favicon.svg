<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- The same mark as web/src/brand.tsx: separate signals converging on one resource.
       A standalone file rather than a generated one, because a favicon is requested
       before any JavaScript runs. Colours are literal here for the same reason — a
       custom property has no :root to read from in a favicon. -->
  <rect width="24" height="24" rx="5" fill="#0d1017"/>
  <g stroke="#6d9bff" stroke-width="2" stroke-linecap="round">
    <path d="M3.5 6.5 L11 10.5" opacity="0.55"/>
    <path d="M3.5 12 L11 12" opacity="0.8"/>
    <path d="M3.5 17.5 L11 13.5" opacity="0.55"/>
    <circle cx="15.5" cy="12" r="4.2" fill="none"/>
  </g>
  <circle cx="15.5" cy="12" r="1.3" fill="#6d9bff"/>
</svg>
