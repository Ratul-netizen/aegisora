[workspace]
resolver = "3"
members = ["crates/*"]
# The W1 benchmark generator is a standalone throwaway tool with deliberately zero
# dependencies. It must not join the workspace or it inherits the shared dependency
# graph and stops being the independent thing it is.
exclude = ["bench/gen"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/Ratul-netizen/aegisora"
authors = ["Ratul-netizen"]
# These crates are the inside of one server, not a library anyone installs. They depend
# on each other by path, which crates.io does not accept, so publishing one could only
# ever produce a broken package. Saying so here makes `cargo publish` refuse, and lets
# cargo-deny tell a path dependency apart from an unpinned crates.io "*".
publish = false

[workspace.dependencies]
# --- core ---
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# --- monitoring profiles (M2) ---------------------------------------------------
# YAML, because a profile is written and reviewed by a human — an OID table in JSON is
# unreadable and a customer editing one will make a mistake nobody catches. serde_yaml
# itself is archived; this is the maintained fork, MIT, same API.
serde_yaml_ng = "0.10"
thiserror = "2"

# --- crypto (M0.4) -------------------------------------------------------------
# Selected by feature, never at runtime: validation attaches to a binary, not to a
# code path. See SPEC.md M0.4. `aws-lc-rs` is NOT enabled by default because it
# needs a C toolchain; the FIPS artifact is a separate build.
aes-gcm = "0.10"
argon2 = "0.5"
# getrandom directly rather than rand_core: the only randomness needed is "fill these
# bytes from the OS CSPRNG", and going straight to the source avoids being pinned to
# whichever rand_core major version the AEAD crates happen to depend on.
getrandom = "0.3"
zeroize = { version = "1", features = ["zeroize_derive"] }

# --- schema migrations (M0.6) ---------------------------------------------------
# SHA-256 here is integrity, not secrecy: it detects an edited migration that has
# already been applied. It is deliberately not routed through uops-secrets, which owns
# the primitives whose misuse would leak credentials.
sha2 = "0.10"
# default-features off: no TLS. See crates/uops-ch-migrate/Cargo.toml for why.
ureq = { version = "3", default-features = false }

# --- async (M0.7) ---------------------------------------------------------------
# The first tokio in the workspace. The bus is the component that needs it: a
# publish that blocks when a consumer is behind IS the backpressure design, and that
# is an async property. Features are narrow on purpose — the server binary will want
# more, and it can ask for more there.
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
async-trait = "0.1"
# futures-core only: BoxStream and the Stream trait. futures-util is a dev dependency
# where the combinators are actually used, so the library does not carry them.
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# --- PostgreSQL (M1) ------------------------------------------------------------
# No TLS feature, deliberately, and for the same reason as ureq in uops-ch-migrate:
# the rustls/native-tls trees carry licences outside the cargo-deny allow-list, and
# every deployment shape reaches PostgreSQL over a private network or a unix socket.
# Adding TLS is a feature flag and a deployment-profile decision, not a rewrite.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "migrate",
] }

# --- identity (M1) --------------------------------------------------------------
# A syslog receiver at 50k msg/s cannot hit PostgreSQL per message (SPEC M0.2), so
# resolution is cache-first. Hand-rolling an LRU is eighty lines of pointer surgery
# for a solved problem.
lru = "0.18"

# --- HTTP (M1) ------------------------------------------------------------------
# No TLS in the server: terminate at a reverse proxy. Same licence reasoning as the
# ClickHouse and PostgreSQL clients, and on-premise deployments put one in front
# anyway for certificate management they already have processes for.
axum = { version = "0.8", default-features = false, features = [
    "http1", "json", "query", "tokio", "macros",
] }
tower = "0.5"
# "fs" is for uops-server serving the web build from the same origin as the API — see
# crates/uops-server/src/web.rs for why that is one process rather than two containers.
tower-http = { version = "0.6", default-features = false, features = ["trace", "limit", "fs"] }

# --- ClickHouse client (M1) -----------------------------------------------------
# hyper rather than a new HTTP stack: axum already pulls exactly these, so this adds
# no licences, no download and nothing to the SBOM. No TLS, for the same reason as
# every other client here — see the sqlx note above.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"

# --- internal ---
uops-core = { path = "crates/uops-core" }
uops-query = { path = "crates/uops-query" }
uops-secrets = { path = "crates/uops-secrets" }
uops-identity = { path = "crates/uops-identity" }
uops-store-pg = { path = "crates/uops-store-pg" }
uops-profile = { path = "crates/uops-profile" }
uops-api = { path = "crates/uops-api" }
uops-server = { path = "crates/uops-server" }
uops-store-ch = { path = "crates/uops-store-ch" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Enumerating every error variant in a doc comment adds noise without adding safety.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
# Dependencies at opt-level 1: the crypto and uuid crates are pathologically slow
# when built unoptimised, which makes the test suite feel broken.
[profile.dev.package."*"]
opt-level = 1
