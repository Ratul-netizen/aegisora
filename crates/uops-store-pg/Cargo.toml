[package]
name = "uops-store-pg"
description = "The control plane over PostgreSQL. Every query is tenant-scoped and compile-time checked."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
uops-core = { workspace = true, features = ["sqlx"] }
uops-identity.workspace = true
uops-secrets.workspace = true
uops-profile.workspace = true
# For Range and Sweep. A discovery job is validated with the same gate the sweeper uses,
# so the operator gets the sentence that says what to do instead rather than the name of
# a CHECK constraint -- see the module docs in src/discovery_jobs.rs.
uops-discover.workspace = true
# Filling a device's vendor from an interface MAC when the device does not say — see
# src/discovery.rs. No dependencies of its own; the table is embedded.
uops-oui.workspace = true
uops-query.workspace = true
# The pipeline's Enricher trait. The dependency points this way -- the pipeline knows
# nothing about PostgreSQL, and the store is what reaches across -- which is the same
# direction as uops-query and PgCatalog.
uops-pipeline.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# For the uops-pg-migrate binary only. sqlx already requires a tokio runtime at run
# time, so this adds two features rather than a dependency.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
