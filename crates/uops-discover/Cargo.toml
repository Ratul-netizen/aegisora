[package]
name = "uops-discover"
description = "Finding devices. A bounded sweep, one SNMP question, and what the answer identifies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
uops-core.workspace = true
uops-snmp.workspace = true
# For `Oid`, which is where `sysObjectID` lands and what profile resolution matches on.
# Discovery does not resolve profiles itself -- `uops_profile::resolve` already does, and
# calling it needs the candidate set, which is the store's business rather than this
# crate's.
uops-profile.workspace = true

futures-util.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
# test-util: the paused clock. Measuring a rate cap against the wall would mean a test
# that waits five minutes, so it would be #[ignore]d, so it would never run.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
# The concurrency cap needs a transport that counts overlapping probes; the simulator has
# no notion of an outstanding request. Implementing Transport by hand needs the attribute.
async-trait.workspace = true

[lints]
workspace = true
