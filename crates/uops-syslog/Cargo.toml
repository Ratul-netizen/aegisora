[package]
name = "uops-syslog"
description = "RFC 5424 and RFC 3164 parsing, and RFC 6587 framing. SPEC M3."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
chrono.workspace = true
thiserror.workspace = true
# The receivers. The parsers themselves touch none of this -- one message in, one parsed
# message out -- which is what lets both wire formats be tested exhaustively without a
# network. `socket2` is for SO_RCVBUF, which SPEC asks to be raised explicitly and which
# tokio's UdpSocket does not expose.
socket2.workspace = true
uops-core.workspace = true
# Attribution -- who the message belongs to, which site, which vendor. Worked out once
# in the pipeline for every collector rather than per-collector: SPEC M0.2 is explicit
# that "resolution happens once, in the pipeline, not in each collector", because two
# collectors resolving independently would each create their own provisional resource
# for the same unknown device.
uops-pipeline.workspace = true
# The output type. A syslog message and an OTLP one become the same row, which is what
# makes them correlatable — so the row type is the store's rather than this crate's.
uops-store-ch.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "io-util", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
