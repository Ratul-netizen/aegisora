[package]
name = "uops-core"
description = "Resource identity, telemetry envelope, and shared types. Imported by every other crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[features]
# Lets the typed IDs be bound directly as query parameters and decoded from rows.
# Optional so that a collector or the frontend's WASM build does not link a database
# driver to use the envelope types.
sqlx = ["dep:sqlx"]

[dependencies]
uuid.workspace = true
chrono.workspace = true
serde.workspace = true
chrono-tz.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
sqlx = { workspace = true, optional = true }

[lints]
workspace = true
