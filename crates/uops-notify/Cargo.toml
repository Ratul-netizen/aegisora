[package]
name = "uops-notify"
description = "Delivering an alert to a channel, within a rate limit and a budget."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
uops-core.workspace = true
uops-store-pg.workspace = true

chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# The same hyper the ClickHouse client uses, for the same reason: axum already pulls
# exactly these, so a webhook adds no licences, no download and nothing to the SBOM.
# Plain HTTP, like every other client in this workspace -- see the TLS note in the root
# Cargo.toml, and `webhook.rs` for what that means for an https:// endpoint.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["time", "rt", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
sqlx.workspace = true

[lints]
workspace = true
