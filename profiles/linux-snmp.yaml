# A Linux host running net-snmp.
#
# UCD-SNMP-MIB rather than HOST-RESOURCES-MIB for CPU and memory: hrProcessorLoad is a
# per-processor table whose semantics vary by agent, while ssCpuRaw* are cumulative
# jiffies that mean the same thing everywhere and are counters, so a rate is computed
# from the raw series at query time rather than trusted from a gauge the agent invented.
id: linux-snmp
version: 1
name: Linux (net-snmp)

match:
  # net-snmp's own enterprise arc. A Linux box reports this as sysObjectID unless
  # somebody overrode it.
  sysobjectid_prefix: "1.3.6.1.4.1.8072.3.2.10"

discovery:
  - kind: interface
    walk: "1.3.6.1.2.1.2.2.1"
    key: ifIndex
    creates:
      resource_kind: interface
      name_from: "1.3.6.1.2.1.31.1.1.1.1"
      relationship: member_of
      identifiers:
        - kind: mac
          oid: "1.3.6.1.2.1.2.2.1.6"

metrics:
  - name: system.cpu.time.user
    oid: "1.3.6.1.4.1.2021.11.50.0"        # ssCpuRawUser
    kind: counter
    unit: s
    interval: 60s
  - name: system.cpu.time.system
    oid: "1.3.6.1.4.1.2021.11.52.0"        # ssCpuRawSystem
    kind: counter
    unit: s
    interval: 60s
  - name: system.cpu.time.idle
    oid: "1.3.6.1.4.1.2021.11.53.0"        # ssCpuRawIdle
    kind: counter
    unit: s
    interval: 60s
  - name: system.memory.available
    oid: "1.3.6.1.4.1.2021.4.6.0"          # memAvailReal
    kind: gauge
    unit: KiBy
    interval: 60s
  - name: system.memory.total
    oid: "1.3.6.1.4.1.2021.4.5.0"          # memTotalReal
    kind: gauge
    unit: KiBy
    interval: 300s
  - name: system.uptime
    oid: "1.3.6.1.2.1.1.3.0"
    kind: gauge
    unit: s
    interval: 60s
  - name: network.io.receive
    oid: "1.3.6.1.2.1.31.1.1.1.6"
    kind: counter
    unit: By
    scope: interface
    interval: 60s
  - name: network.io.transmit
    oid: "1.3.6.1.2.1.31.1.1.1.10"
    kind: counter
    unit: By
    scope: interface
    interval: 60s

availability:
  - kind: icmp
    interval: 30s
    timeout: 2s
    retries: 3

# What the device *is*. See uops_profile::Identity.
#
# No ENTITY-MIB here: net-snmp and the Windows SNMP service do not implement
# entPhysicalTable, so asking for it would be four OIDs per device per discovery that
# never answer. sysDescr is what these agents do have, and on Linux it is the kernel
# string — which is the operating system, exactly where it belongs.
identity:
  os: "1.3.6.1.2.1.1.1.0"                     # sysDescr
