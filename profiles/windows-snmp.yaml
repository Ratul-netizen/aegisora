# Windows Server with the SNMP Service.
#
# Everything here is HOST-RESOURCES-MIB, because the Windows SNMP agent implements that
# and very little else. Memory is in storage-table units and CPU is a per-processor
# table, so both need the walk rather than a scalar — hence no hard-coded instance on
# hrProcessorLoad.
#
# Windows reports the Microsoft enterprise arc as sysObjectID; 1.3.6.1.4.1.311.1.1.3.1
# is the Windows NT / Server subtree.
id: windows-snmp
version: 1
name: Windows Server (SNMP Service)

match:
  sysobjectid_prefix: "1.3.6.1.4.1.311.1.1.3.1"

discovery:
  - kind: interface
    walk: "1.3.6.1.2.1.2.2.1"
    key: ifIndex
    creates:
      resource_kind: interface
      # Windows ifName is the adapter GUID and ifDescr is the human name — the reverse
      # of every other agent here. ifAlias is what an administrator actually set, and
      # is empty when they did not, so ifDescr it is.
      name_from: "1.3.6.1.2.1.2.2.1.2"     # ifDescr
      relationship: member_of
      identifiers:
        - kind: mac
          oid: "1.3.6.1.2.1.2.2.1.6"

metrics:
  - name: system.cpu.utilization
    oid: "1.3.6.1.2.1.25.3.3.1.2.1"        # hrProcessorLoad, first processor
    kind: gauge
    unit: "%"
    interval: 60s
  - name: system.memory.utilization
    oid: "1.3.6.1.2.1.25.2.3.1.6.1"        # hrStorageUsed, physical memory row
    kind: gauge
    unit: "1"
    interval: 60s
  - name: system.uptime
    oid: "1.3.6.1.2.1.1.3.0"
    kind: gauge
    unit: s
    interval: 60s
  - name: network.io.receive
    oid: "1.3.6.1.2.1.31.1.1.1.6"
    kind: counter
    unit: By
    scope: interface
    interval: 60s
  - name: network.io.transmit
    oid: "1.3.6.1.2.1.31.1.1.1.10"
    kind: counter
    unit: By
    scope: interface
    interval: 60s

availability:
  - kind: icmp
    interval: 30s
    timeout: 2s
    retries: 3

# What the device *is*. See uops_profile::Identity.
#
# No ENTITY-MIB here: net-snmp and the Windows SNMP service do not implement
# entPhysicalTable, so asking for it would be four OIDs per device per discovery that
# never answer. sysDescr is what these agents do have, and on Linux it is the kernel
# string — which is the operating system, exactly where it belongs.
identity:
  os: "1.3.6.1.2.1.1.1.0"                     # sysDescr
