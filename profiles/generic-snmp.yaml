# The fallback, and the most important file here.
#
# SPEC §M2: "an unknown vendor should still get interfaces and availability, not
# nothing." A device nobody has written a profile for is the normal case in a network
# somebody actually runs, and this is what they get: the standard MIBs, which every
# agent implements because they are what "supports SNMP" means.
#
# Nothing vendor-specific may go in here. The moment it does, every unknown device in
# every network starts polling an OID its agent does not have.
id: generic-snmp
version: 1
name: Generic SNMP device

# No match block: this is never selected by sysObjectID. It is what you get when
# nothing else matched.

discovery:
  - kind: interface
    walk: "1.3.6.1.2.1.2.2.1"              # IF-MIB::ifEntry
    key: ifIndex
    creates:
      resource_kind: interface
      # ifName, not ifDescr: ifDescr is a sentence on some agents ("Ethernet
      # Interface") and identical across every port on others.
      name_from: "1.3.6.1.2.1.31.1.1.1.1"  # ifXEntry::ifName
      relationship: member_of
      identifiers:
        - kind: mac
          oid: "1.3.6.1.2.1.2.2.1.6"       # ifPhysAddress

metrics:
  # The 64-bit counters, deliberately. SPEC §M2: a 32-bit ifInOctets wraps in about 34
  # seconds on a 1 Gbps link, which is faster than any interval here. An agent too old
  # for ifXTable will return nothing for these, and nothing is better than a number
  # that silently means a different thing every minute.
  - name: network.io.receive
    oid: "1.3.6.1.2.1.31.1.1.1.6"          # ifHCInOctets
    kind: counter
    unit: By
    scope: interface
    interval: 60s
  - name: network.io.transmit
    oid: "1.3.6.1.2.1.31.1.1.1.10"         # ifHCOutOctets
    kind: counter
    unit: By
    scope: interface
    interval: 60s
  - name: network.interface.errors.receive
    oid: "1.3.6.1.2.1.2.2.1.14"            # ifInErrors
    kind: counter
    unit: "1"
    scope: interface
    interval: 60s
  - name: network.interface.errors.transmit
    oid: "1.3.6.1.2.1.2.2.1.20"            # ifOutErrors
    kind: counter
    unit: "1"
    scope: interface
    interval: 60s
  - name: system.uptime
    oid: "1.3.6.1.2.1.1.3.0"               # sysUpTime
    kind: gauge
    unit: s
    interval: 60s

availability:
  - kind: icmp
    interval: 30s
    timeout: 2s
    retries: 3
