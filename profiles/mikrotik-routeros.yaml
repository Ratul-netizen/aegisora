# MikroTik RouterOS. The example SPEC §M2 is written around.
#
# RouterOS implements the standard MIBs well, so most of this is IF-MIB and
# HOST-RESOURCES-MIB. The vendor arc is used for the temperature sensor, which has no
# standard equivalent and is the thing that actually fails in a hot rack.
id: mikrotik-routeros
version: 1
name: MikroTik RouterOS

match:
  sysobjectid_prefix: "1.3.6.1.4.1.14988"

discovery:
  - kind: interface
    walk: "1.3.6.1.2.1.2.2.1"
    key: ifIndex
    creates:
      resource_kind: interface
      name_from: "1.3.6.1.2.1.31.1.1.1.1"
      relationship: member_of
      identifiers:
        - kind: mac
          oid: "1.3.6.1.2.1.2.2.1.6"

metrics:
  - name: system.cpu.utilization
    oid: "1.3.6.1.2.1.25.3.3.1.2.1"        # hrProcessorLoad.1
    kind: gauge
    unit: "%"
    interval: 60s
  - name: system.uptime
    oid: "1.3.6.1.2.1.1.3.0"
    kind: gauge
    unit: s
    interval: 60s
  - name: hardware.temperature
    oid: "1.3.6.1.4.1.14988.1.1.3.10.0"    # mtxrHlTemperature, deci-degrees
    kind: gauge
    unit: Cel
    interval: 60s
  - name: network.io.receive
    oid: "1.3.6.1.2.1.31.1.1.1.6"
    kind: counter
    unit: By
    scope: interface
    interval: 60s
  - name: network.io.transmit
    oid: "1.3.6.1.2.1.31.1.1.1.10"
    kind: counter
    unit: By
    scope: interface
    interval: 60s

availability:
  - kind: icmp
    interval: 30s
    timeout: 2s
    retries: 3

# What the device *is*, as opposed to how it is doing. See uops_profile::Identity.
#
# ENTITY-MIB's entPhysicalTable, at index 1 — the chassis on nearly every implementation
# that has one. Instance-qualified rather than walked: the poller reads these in the same
# single GET as everything else it wants, and a walk of entPhysicalTable on a chassis
# switch returns a row per module, fan and transceiver to find one model number.
#
# A device that does not implement ENTITY-MIB answers none of them and simply has no
# model recorded. That is most non-enterprise equipment, which is why `os` falls back to
# sysDescr — every agent answers that, because it is what "supports SNMP" means.
identity:
  vendor:     "1.3.6.1.2.1.47.1.1.1.1.12.1"   # entPhysicalMfgName
  model:      "1.3.6.1.2.1.47.1.1.1.1.13.1"   # entPhysicalModelName
  serial:     "1.3.6.1.2.1.47.1.1.1.1.11.1"   # entPhysicalSerialNum
  os_version: "1.3.6.1.2.1.47.1.1.1.1.10.1"   # entPhysicalSoftwareRev
  os:         "1.3.6.1.2.1.1.1.0"             # sysDescr
